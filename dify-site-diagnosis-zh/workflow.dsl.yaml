          \ timeout=120)\n            result = resp.json()\n            if not result.get(\"ok\"):\n                empty[\"error\"] = result.get(\"error\", \"unknown\")\n                return empty\n\
          \            d = result.get(\"data\", {})\n            return {\"ok\": True, \"error\": \"\", \"geo_score\": d.get(\"geo_score\", 0), \"label_zh\": d.get(\"label_zh\", \"\"), \"report_html\":\
          \ d.get(\"report_html\", \"\"), \"report_markdown\": d.get(\"report_markdown\", \"\"), \"download_url_html\": d.get(\"download_url_html\", \"\"), \"download_url_md\": d.get(\"download_url_md\"\
