            ## 三、优先级与建议排期

            {表格：级别 | 任务编号区间 | 报告建议窗口 | 完成情况}


            ## 四、逐项执行与验收清单

            ### N. {任务标题}

            | 字段 | 值 |

            |---|---|

            | **优先级** | P0/P1/P2/P3｜严重/高/中/低 |

